[tool.ruff]
extend-exclude = ["migrations"]
line-length = 120

[tool.ruff.lint]
ignore = ["F401", "F403", "F405", "BLE001"]
extend-select = [
    "BLE", # 开启整个 flake8-blind-except 规则组
    "SIM", # 开启整个 flake8-simplify 代码简化规则组
    "B",   # 开启整个 flake8-bugbear 规则组
]

[tool.ruff.format]
quote-style = "double"
