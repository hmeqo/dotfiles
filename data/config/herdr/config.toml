onboarding = false

[theme]
name = "vesper"
auto_switch = false

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

[experimental]
kitty_graphics = true

[keys]
prefix = "ctrl+b"
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
previous_tab = ["prefix+p", "ctrl+alt+p"]
next_tab = ["prefix+n", "ctrl+alt+n"]
new_tab = ["prefix+c", "ctrl+alt+c"]
move_tab_previous = "ctrl+alt+comma"
move_tab_next = "ctrl+alt+period"
split_vertical = ["prefix+v", "ctrl+alt+|"]
split_horizontal = ["prefix+minus", "ctrl+alt+backslash"]
zoom = ["prefix+z", "ctrl+alt+z"]
previous_workspace = "ctrl+alt+["
next_workspace = "ctrl+alt+]"

[keys.indexed]
workspaces = "ctrl+alt"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
width = "95%"
height = "90%"

[[keys.command]]
key = "prefix+ctrl+t"
type = "popup"
command = "btop"
width = "95%"
height = "90%"

[[keys.command]]
key = "prefix+ctrl+u"
type = "popup"
command = "gdu"
width = "95%"
height = "90%"

[[keys.command]]
key = "prefix+ctrl+s"
type = "popup"
command = "$SHELL"
width = "95%"
height = "90%"
