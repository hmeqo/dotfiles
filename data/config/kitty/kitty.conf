# 
# Font and colour
# 

font_family      Maple Mono NF
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12

foreground #dfdfdf
background #171717
background_opacity 0.95

# 
# Mouse
# 

mouse_hide_wait 1.0
copy_on_select yes

# 
# Bindings
# 

mouse_map left click ungrabbed no-op
mouse_map ctrl+left click ungrabbed mouse_handle_click selection link prompt
# mouse_map ctrl+left press ungrabbed mouse_selection norma
mouse_map ctrl+left press ungrabbed,grabbed mouse_click_url
mouse_map right press ungrabbed paste_from_selection
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map shift+page_up remote_control scroll-window 0.5p-
map shift+page_down remote_control scroll-window 0.5p+
map ctrl+shift+f combine : show_scrollback : send_text normal,application /

map ctrl+backspace send_text all \x17

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10

# 
# Window
# 

remember_window_size  no
initial_window_width  1160
initial_window_height 700
# needs_render yes

# 
# Sound
# 

enable_audio_bell no

# 
# Cursor
# 

cursor_trail 3
cursor_trail_decay 0.2 0.3
cursor_trail_start_threshold 0
# cursor_trail_start_threshold 1

#
# Tab bar
#

tab_bar_style powerline
tab_bar_edge top
tab_bar_align left
tab_bar_min_tabs 2

tab_bar_background #0e0e0e
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0

active_tab_background #171717
active_tab_foreground #dfdfdf
active_tab_font_style bold

inactive_tab_background #0e0e0e
inactive_tab_foreground #555555
inactive_tab_font_style normal

tab_powerline_style slanted
tab_title_template "{index}  {title}"
tab_switch_strategy previous
